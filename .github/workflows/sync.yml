name: Dub to GA4 Auto Sync

on:
  schedule:
    # Запуск каждые 10 минут (встроенный будильник GitHub)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Оставляет возможность нажать кнопку вручную

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests idna

      - name: Run sync script
        run: python sync.py
