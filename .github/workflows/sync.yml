name: Dub to GA4 Auto Sync

on:
  schedule:
    # Запуск каждые 15 минут в фоновом режиме (будильник)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Оставляет зелёную кнопку для ручного запуска в любой момент

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests idna

      - name: Run sync script
        run: |
          python sync.py
