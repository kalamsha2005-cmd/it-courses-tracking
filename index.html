<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astana Hub Aktobe — Перенаправление...</title>

  <!-- Google tag (gtag.js) GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4QCCV5D0Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-T4QCCV5D0Z', {
      send_page_view: true
    });

    // Полная карта реальных ссылок из твоего Dub.co
    const routeMap = {
      // Курсы платформы Astana Hub (по их точным ссылкам)
      fs: "https://edu.astanahub.com/courses/3dcbfff1-1a89-4c9b-a2c3-c58c0425ac6d",
      bc: "https://edu.astanahub.com/courses/c9d1629b-f2c2-40b8-9097-c92623ced30d",
      sa: "https://edu.astanahub.com/courses/cc946059-304e-450a-895b-e671db651cba",
      ss: "https://edu.astanahub.com/courses/f2159fbf-0ecf-43cb-9376-b7efc6fc7df5",
      nlc: "https://edu.astanahub.com/courses/8d83f744-1846-43ea-bc2a-1b8a37084a2e",
      pe: "https://edu.astanahub.com/courses/74b6914d-7e3b-4f52-b0ae-8f989e2294a7",

      // Decentrathon 6.0
      dec: "https://decentrathon.ai/"
    };

    function startRedirect() {
      const urlParams = new URLSearchParams(window.location.search);
      const target = urlParams.get('target');
      const utmSource = urlParams.get('utm_source') || 'direct';
      const utmMedium = urlParams.get('utm_medium') || 'qr_code';
      const utmCampaign = urlParams.get('utm_campaign') || 'none';

      // 1. По умолчанию открываем PDF-каталог на Google Диске
      let destinationUrl = "https://drive.google.com/file/d/1MFNJxYyPoH1EVEO3cQIbQ0bdLT8ZImZU/view?usp=sharing";
      let eventName = "qr_catalog_scan";
      let eventPayload = {
        scan_source: utmSource,
        medium: utmMedium,
        campaign: utmCampaign,
        transport_type: 'beacon'
      };

      // 2. Если кликнули по курсу или Decentrathon
      if (target && routeMap[target]) {
        destinationUrl = routeMap[target];
        eventName = (target === 'dec') ? "decentrathon_click" : "course_selected";
        eventPayload = {
          item_id: target,
          click_source: utmSource,
          medium: utmMedium,
          campaign: utmCampaign,
          transport_type: 'beacon'
        };
      }

      // Пробрасываем UTM-метки дальше на итоговую страницу
      const searchClone = new URLSearchParams(window.location.search);
      searchClone.delete('target');
      const extraParams = searchClone.toString();
      if (extraParams) {
        destinationUrl += (destinationUrl.includes('?') ? '&' : '?') + extraParams;
      }

      // Отправляем аналитику в GA4
      gtag('event', eventName, eventPayload);

      // Редирект через 450 мс
      setTimeout(function() {
        window.location.replace(destinationUrl);
      }, 450);
    }

    window.addEventListener('DOMContentLoaded', startRedirect);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 85vh;
      margin: 0;
      color: #333;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #eee;
      border-top: 3px solid #0052cc;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-size:15px; margin:0;">Загрузка Astana Hub...</p>
</body>
</html>
