<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перенаправление...</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4QCCV5D0Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Инициализация Google Analytics 4
    gtag('config', 'G-T4QCCV5D0Z');

    function redirect() {
      // Базовая ссылка на файл каталога курсов на Google Диске
      const targetBase = "https://drive.google.com/file/d/1MFNJxYyPoH1EVEO3cQIbQ0bdLT8ZImZU/view?usp=sharing";
      
      // Забираем UTM-метки, переданные через Dub.co
      const search = window.location.search;
      const finalUrl = search 
        ? (targetBase + (targetBase.includes('?') ? '&' : '?') + search.substring(1)) 
        : targetBase;

      // Фиксируем событие перехода в GA4
      gtag('event', 'qr_visit', {
        transport_type: 'beacon',
        event_callback: function() { 
          window.location.replace(finalUrl); 
        }
      });

      // Страховочный таймер: перенаправляет через 500 мс, если аналитика ответила с задержкой
      setTimeout(function() {
        window.location.replace(finalUrl);
      }, 500);
    }

    window.addEventListener('DOMContentLoaded', redirect);
  </script>
</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 90vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: #444;">
  <p style="font-size: 16px; margin-bottom: 8px;">Перенаправление в каталог Astana Hub...</p>
  <p style="font-size: 13px; color: #888;">Если страница не открылась автоматически, <a id="fallback-link" href="#" style="color: #0066cc;">нажмите здесь</a>.</p>

  <script>
    // Запасная прямая ссылка на случай отключенного JS в браузере
    document.getElementById('fallback-link').href = "https://drive.google.com/file/d/1MFNJxYyPoH1EVEO3cQIbQ0bdLT8ZImZU/view?usp=sharing" + window.location.search;
  </script>
</body>
</html>
