<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-T4QCCV5D0Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-T4QCCV5D0Z');

    // База данных всех 10 ссылок с их UTM-метками

      // 1. Каталог курсов (экраны)

        url: 'https://drive.google.com/file/d/1MFNJxYyPoH1EVEo3cQIbQ0bdLT8ZImZU/view?usp=sharing&utm_source=offline_presentation&utm_medium=qr_code&utm_campaign=aktobe_catalog',
        event: 'catalog_view',
        source: 'screens',
        campaign: 'aktobe_catalog',
        title: 'Каталог IT-курсов (Экраны)'
      },
      // 2. Каталог курсов (презентация)
      'presentation': {
        url: 'https://drive.google.com/file/d/1MFNJxYyPoH1EVEo3cQIbQ0bdLT8ZImZU/view?usp=sharing&utm_source=offline_presentation&utm_medium=qr_code&utm_campaign=aktobe_catalog',
        event: 'catalog_view',
        source: 'presentation',
        campaign: 'aktobe_catalog',
        title: 'Каталог IT-курсов (Презентация)'
      },
      // 3. Decentrathon 6.0 (экраны)
      'dec_screens': {
        url: 'https://decentrathon.ai/?utm_source=hub_screens&utm_medium=qr&utm_campaign=decentrathon+6.0&utm_content=aktobe',
        event: 'decentrathon_registration',
        source: 'hub_screens',
        campaign: 'decentrathon_6.0',
        title: 'Decentrathon 6.0 (Экраны)'
      },
      // 4. Decentrathon 6.0 (презентация)
      'dec_presentation': {
        url: 'https://decentrathon.ai/?utm_source=hub_screens&utm_medium=qr&utm_campaign=decentrathon+6.0&utm_content=aktobe',
        event: 'decentrathon_registration',
        source: 'presentation',
        campaign: 'decentrathon_6.0',
        title: 'Decentrathon 6.0 (Презентация)'
      },
      // 5. Prompt Engineering
      'pe': {
        url: 'https://edu.astanahub.com/courses/74b6914d-7e3b-4f52-b0ae-8f989e2294a7?utm_source=presentation_pdf&utm_medium=button&utm_campaign=prompt-engineering',
        event: 'course_click',
        course_name: 'Prompt Engineering',
        campaign: 'prompt-engineering',
        title: 'Prompt Engineering'
      },
      // 6. No-code / Low-code School
      'nlc': {
        url: 'https://edu.astanahub.com/courses/8d83f744-1846-43ea-bc2a-1b8a37084a2e?utm_source=presentation_pdf&utm_medium=button&utm_campaign=nocode-school',
        event: 'course_click',
        course_name: 'No-code School',
        campaign: 'nocode-school',
        title: 'No-code / Low-code School'
      },
      // 7. Startup School
      'ss': {
        url: 'https://edu.astanahub.com/courses/f2159fbf-0ecf-43cb-9376-b7efc6fc7df5?utm_source=presentation_pdf&utm_medium=button&utm_campaign=startup-school',
        event: 'course_click',
        course_name: 'Startup School',
        campaign: 'startup-school',
        title: 'Startup School'
      },
      // 8. Startup Academy
      'sa': {
        url: 'https://edu.astanahub.com/courses/cc946059-304e-450a-895b-e671db651cba?utm_source=presentation_pdf&utm_medium=button&utm_campaign=startup-academy',
        event: 'course_click',
        course_name: 'Startup Academy',
        campaign: 'startup-academy',
        title: 'Startup Academy'
      },
      // 9. Beta Career
      'bc': {
        url: 'https://edu.astanahub.com/courses/c9d1629b-f2c2-40b8-9097-c92623ced30d?utm_source=presentation_pdf&utm_medium=button&utm_campaign=beta-career',
        event: 'course_click',
        course_name: 'Beta Career',
        campaign: 'beta-career',
        title: 'Beta Career'
      },
      // 10. Freelance School
      'fs': {
        url: 'https://edu.astanahub.com/courses/3dcbfff1-1a89-4c9b-a2c3-c58c0425ac6d?utm_source=presentation_pdf&utm_medium=button&utm_campaign=freelance-school',
        event: 'course_click',
        course_name: 'Freelance School',
        campaign: 'freelance-school',
        title: 'Freelance School'
      }
    };

    // Определение нужной ссылки по параметру в адресной строке
    const params = new URLSearchParams(window.location.search);
    const routeKey = (params.get('route') || params.get('target') || 'screens').toLowerCase();
    const item = routeCatalog[routeKey] || routeCatalog['screens'];

    // Отправка события в Google Analytics 4
    gtag('event', item.event, {
      'event_category': 'conversion',
      'course_title': item.course_name || item.title,
      'campaign': item.campaign,
      'source': item.source || 'presentation_pdf'
    });

    // Редирект на целевой ресурс с UTM-метками
    setTimeout(function() {
      window.location.replace(item.url);
    }, 350);
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;

      justify-content: center;
      align-items: center;
      min-height: 80vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #cbd5e1;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Загрузка Astana Hub...</p>
</body>
</html>
